name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        id: install-deps
        continue-on-error: true
        with:
          extra-packages: |
            any::rcmdcheck
            github::vdeminstitute/vdemdata
          needs: check
      # macOS runners occasionally fail this step with a "Cannot extract ...
      # unknown archive type" pak error, apparently from a corrupted binary
      # download; retrying once resolves it without masking a real failure,
      # since a persistent problem will fail here too and the job stays red.
      - name: Retry dependency installation
        if: steps.install-deps.outcome == 'failure'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            github::vdeminstitute/vdemdata
          needs: check
      - uses: r-lib/actions/check-r-package@v2
