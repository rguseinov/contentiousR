          [![Monthly downloads](https://cranlogs.r-pkg.org/badges/last-month/contentiousR)](https://CRAN.R-project.org/package=contentiousR)
          [![Lifecycle: stable](https://img.shields.io/badge/lifecycle-stable-brightgreen.svg)](https://lifecycle.r-lib.org/articles/stages.html#stable)
          [![R-CMD-check](https://github.com/rguseinov/contentiousR/actions/workflows/R-CMD-check.yaml/badge.svg)](https://github.com/rguseinov/contentiousR/actions/workflows/R-CMD-check.yaml)

reference:
